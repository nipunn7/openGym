# openGym — iOS build + TestFlight
#
# Builds the STANDALONE Capacitor flavour of openGym (VITE_MOBILE=1: no backend,
# no accounts, no sync — data lives on the device) and ships it to TestFlight.
#
# NOTHING SECRET BELONGS IN THIS FILE. It is committed to the repository. The App
# Store Connect API key lives in the Codemagic UI and is referenced below only by
# the name you gave it there.
#
# ── One-time setup in the Codemagic UI ────────────────────────────────────────
#   1. Nothing new, if `Thought ASC Key` already exists — an App Store Connect API
#      key is ACCOUNT-wide, not per-app, so the same integration signs and uploads
#      every app under the team. Reused below.
#   2. In App Store Connect, create the app record for com.nipungupta.opengym
#      (Apps → + → New App). Signing is automatic from there.
# ──────────────────────────────────────────────────────────────────────────────

workflows:
  ios-testflight:
    name: openGym — iOS build + TestFlight
    instance_type: mac_mini_m2          # free-tier Apple-silicon macOS runner
    max_build_duration: 60

    # BUILDS ARE MANUAL — triggered by pushing a tag, never by pushing code.
    # Same reasoning as the Thought repo: the 500 free macOS minutes/month are the
    # scarce resource, and building on every push burns them on commits that did
    # not need a native build. Unlike Thought there is no `eas update` OTA channel
    # here, so a JS-only change does still need a rebuild — but it needs one when
    # YOU decide to ship, not on every push.
    #
    #     git tag build-2026-08-23 && git push origin build-2026-08-23
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'build-*'
          include: true
      cancel_previous_builds: true      # a newer tag supersedes an in-flight older one

    integrations:
      app_store_connect: Thought ASC Key   # ← account-wide key, shared with the Thought app

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nipungupta.opengym
      vars:
        XCODE_WORKSPACE: "frontend/ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        # Optional. Numeric "Apple ID" of the app record in App Store Connect
        # (App Information → General Information). When set, the build number is
        # derived from the newest build already on TestFlight. Leave empty on the
        # first run — the workflow falls back to Codemagic's own counter.
        APP_STORE_APPLE_ID: ""
      node: 20
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install frontend dependencies
        working_directory: frontend
        script: |
          node --version && npm --version
          # Same tolerant install as the Thought repo: the committed lockfile is
          # generated by a newer local npm than the runner bundles, and strict
          # `npm ci` can reject it over that skew alone. The lock still pins
          # versions, so the fallback stays reproducible.
          npm ci || npm install --no-audit --no-fund

      - name: Build the mobile web bundle and sync it into the iOS project
        working_directory: frontend
        script: |
          # VITE_MOBILE=1 + jsDelivr media base, then `cap sync` copies dist/ into ios/.
          npm run build:mobile

      - name: Install CocoaPods dependencies
        working_directory: frontend/ios/App
        script: |
          # The Podfile resolves pods from ../../node_modules, so this MUST run
          # after the npm install above.
          pod install

      - name: Apply code signing profiles to the Xcode project
        script: xcode-project use-profiles

      - name: Set marketing version and build number
        script: |
          set -e
          # Marketing version tracks frontend/package.json, as docs/MOBILE.md asks.
          APP_VERSION=$(node -p "require('./frontend/package.json').version")

          LATEST=""
          if [ -n "$APP_STORE_APPLE_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo "")
          fi

          if [ -n "$LATEST" ]; then
            NEW_BUILD=$((LATEST + 1))
          else
            NEW_BUILD="$BUILD_NUMBER"   # Codemagic's own monotonic counter
          fi

          echo "Marketing version: $APP_VERSION"
          echo "Build number:      $NEW_BUILD"

          # Written straight into the project rather than via agvtool: this project
          # has no VERSIONING_SYSTEM set, so agvtool is unreliable here.
          PBX="frontend/ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = $APP_VERSION;/g" "$PBX"
          grep -E 'CURRENT_PROJECT_VERSION|MARKETING_VERSION' "$PBX"

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers on the app record get the build automatically once Apple
        # finishes processing. No external beta review, no waiting on Apple review.
